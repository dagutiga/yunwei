    server {
        listen       80;
        server_name  localhost; # 生产环境替换为你的域名/IP

        # 1. 托管前端静态文件
        location / {
            root   /path/to/vm-management-system/frontend/dist; # 替换为实际dist路径
            index  index.html index.htm;
            try_files $uri $uri/ /index.html; # 解决Vue路由刷新404
            expires 1d;
        }

        # 2. 反向代理后端API
        location /api/ {
            proxy_pass http://127.0.0.1:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_read_timeout 30s;
        }

        # 日志配置
        access_log  /var/log/nginx/vm_access.log;
        error_log   /var/log/nginx/vm_error.log;
    }
